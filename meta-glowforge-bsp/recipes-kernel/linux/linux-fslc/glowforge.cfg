# ForgeFIRM kernel config fragment — Glowforge board on linux-fslc 6.12 (mainline).
#
# Forward-port landing zone (Scarthgap migration #2). Options are added here as
# each factory kernel change is ported:
#   - motion path : i.MX6 SDMA (step-stream) + EPIT timer + glowforge.ko
#   - camera      : mainline OV5648 subdev (drivers/media/i2c/ov5648.c) + imx-media
#   - sensors     : mainline ST LIS2HH12 (st_accel / st_sensors family)
#
# i.MX6 SDMA underpins the factory step-stream playback ForgeFIRM reuses, so it is
# the one thing pinned on from the start. Everything else lands with its milestone.
CONFIG_IMX_SDMA=y

# Full kernel preemption, as the factory kernel ran (imx_v6_v7_defconfig only
# gives PREEMPT_VOLUNTARY). Bounds the wakeup latency of the future SCHED_FIFO
# pulse feeder and the softirq hrtimers (ramp updates, safety sampler, HV-
# watchdog feed). PREEMPT_RT is not selectable on arm32 6.12 (no
# ARCH_SUPPORTS_RT); see kas/README.md backlog for the ring-depth arithmetic
# that makes RT unnecessary for the feeder.
CONFIG_PREEMPT=y

# The 128 MiB SDMA pulse ring comes from the dedicated no-map reserved pool
# (cnc_reserved -> memory-region on the cnc node), NOT from CMA. CMA stays
# pinned on for the camera/imx-media path (64 MiB linux,cma node) and as the
# fallback allocator if the dedicated pool ever fails to attach.
CONFIG_CMA=y
CONFIG_DMA_CMA=y

# control_12v in the DT uses reg-userspace-consumer; not in imx_v6_v7_defconfig.
CONFIG_REGULATOR_USERSPACE_CONSUMER=y

# Motion path: expose EPIT1/EPIT2 to glowforge.ko (arch/arm/mach-imx/epit_api.c).
CONFIG_MXC_EPIT_API=y

# Camera: mainline OV5648 (5 MP) + OV8856 (8 MP, "HD" units) subdevs behind the
# imx6 IPU/MIPI-CSI2 (imx-media) capture path, with a GPIO video-mux modelling
# the factory CAM_SEL MIPI switch (lid/head). Both sensors share the camera@36
# dual-compatible node; whichever matches the chip-id binds.
CONFIG_VIDEO_OV5648=m
CONFIG_VIDEO_OV8856=m
# VIDEO_IMX_MEDIA covers the whole 6.12 imx6 capture path (IPU CSI + the
# imx6-mipi-csi2 receiver); the old VIDEO_IMX_CSI / VIDEO_IMX6_MIPI_CSI2
# symbols do not exist on 6.12 and were silently dropped by merge_config.
CONFIG_VIDEO_IMX_MEDIA=m
CONFIG_VIDEO_MUX=m
CONFIG_MULTIPLEXER=y
CONFIG_MUX_GPIO=y
