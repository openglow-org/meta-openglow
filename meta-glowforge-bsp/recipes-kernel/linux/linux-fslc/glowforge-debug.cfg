# ForgeFIRM debug kernel: lock-correctness checks for the bench drills.
# Applied only when FORGEFIRM_KERNEL_DEBUG = "1" (the kas debug variant),
# never in a release or a normal dev build - these carry a large runtime
# cost and belong on a one-time drill image, not on a shipped one.
#
# What the drills need: DEBUG_MUTEXES to catch a mis-ordered or unbalanced
# mutex across glowforge.ko load and unload, PROVE_LOCKING (lockdep) to
# validate the lock ordering the module takes on its own probe and remove
# paths, and DEBUG_ATOMIC_SLEEP to catch a sleep in an atomic section that
# the forced -EPROBE_DEFER unwind could otherwise hide.
CONFIG_DEBUG_MUTEXES=y
CONFIG_PROVE_LOCKING=y
CONFIG_DEBUG_ATOMIC_SLEEP=y
CONFIG_DEBUG_SPINLOCK=y
