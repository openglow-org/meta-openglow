#@TYPE: Machine
#@NAME: Glowforge Basic/Plus/Pro Compatible
#@SOC: i.MX6S
#@DESCRIPTION: Machine configuration for Glowforge Basic/Plus/Pro
#@MAINTAINER: Scott Wiederhold <s.e.wiederhold@gmail.com>
#
# This machine will build for the standard Glowforge CNC laser
# with the imx6 Solo processor.
#

MACHINEOVERRIDES =. "mx6:mx6dl:"

require conf/machine/include/imx-base.inc
require conf/machine/include/glowforge.inc
require conf/machine/include/arm/armv7a/tune-cortexa9.inc

# ForgeFIRM: the forward-ported mainline-LTS kernel is the one kernel.
PREFERRED_PROVIDER_virtual/kernel ??= "linux-fslc"
PREFERRED_VERSION_linux-fslc ??= "6.12%"

# 6.12 keeps 32-bit DTs under arch/arm/boot/dts/nxp/imx/.
KERNEL_DEVICETREE = "nxp/imx/glowforge.dtb"

UBOOT_MACHINE ?= "glowforge_defconfig"
UBOOT_MAKE_TARGET = "all"
UBOOT_SUFFIX = "imx"
WKS_FILE = "glowforge.wks"

# The serial getty on ttymxc0 comes from imx-base.inc's SERIAL_CONSOLES. The
# kernel has no virtual console (no display), so no getty on tty1.
USE_VT = "0"

# Firmware: the WL18xx blobs and the VPU blob for the i.MX6 Solo
# (vpu_fw_imx6d.bin). imx-base.inc also recommends the e-paper controller
# firmware (every mx6dl board) and the i.MX6 SDMA RAM firmware (every mx6
# board); neither has a consumer here (no EPDC, and an SDMA that runs its
# ROM scripts by design: the built-in driver probes before the rootfs and
# every client on the board uses ROM scripts).
MACHINE_FIRMWARE += " linux-firmware-wl18xx"
MACHINE_FIRMWARE:remove = " \
  firmware-imx-epdc \
  linux-firmware-imx-sdma-imx6q \
"

MACHINE_FEATURES += " wifi"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " \
  kernel-module-glowforge \
"

# Kernel modules: the board's driver set, named explicitly instead of the
# imx-base.inc "kernel-modules" meta-package (which drags every module the
# kernel builds onto the rootfs). Modules these pull in through modules.dep
# (wlcore, mac80211, cfg80211, libarc4, crc7, mux-core, imx-media-common,
# v4l2-jpeg, imx-vdoa, videobuf2, st-accel, st-sensors, ...) come along as
# package dependencies. Anything a driver loads by alias instead (the Wi-Fi
# ciphers) is built into the kernel by the config fragment, so nothing here
# depends on an alias being resolvable from the rootfs.
MACHINE_EXTRA_RRECOMMENDS:remove = "kernel-modules"
MACHINE_EXTRA_RRECOMMENDS += " \
  kernel-module-wl18xx \
  kernel-module-wlcore-sdio \
  kernel-module-ov5648 \
  kernel-module-ov8856 \
  kernel-module-video-mux \
  kernel-module-mux-gpio \
  kernel-module-mux-mmio \
  kernel-module-imx6-media \
  kernel-module-imx6-media-csi \
  kernel-module-imx6-mipi-csi2 \
  kernel-module-coda-vpu \
  kernel-module-lm75 \
  kernel-module-st-accel-i2c \
"
