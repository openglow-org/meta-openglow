#@TYPE: Machine
#@NAME: Glowforge Basic/Plus/Pro Compatible
#@SOC: i.MX6S
#@DESCRIPTION: Machine configuration for Glowforge Basic/Plus/Pro
#@MAINTAINER: Scott Wiederhold <s.e.wiederhold@gmail.com>
#
# This machine will build for the standard Glowforge CNC laser
# with the imx6 Solo processor.
#

MACHINEOVERRIDES =. "mx6:mx6dl:"

require conf/machine/include/imx-base.inc
require conf/machine/include/glowforge.inc
require conf/machine/include/arm/armv7a/tune-cortexa9.inc

# ForgeFIRM: default to the forward-ported mainline-LTS kernel. The legacy
# linux-glowforge 4.14.98 recipe is kept for reference only (its codeaurora
# SRC_URI is dead and it is not forward-ported).
PREFERRED_PROVIDER_virtual/kernel ??= "linux-fslc"
PREFERRED_VERSION_linux-fslc ??= "6.12%"

# 6.12 keeps 32-bit DTs under arch/arm/boot/dts/nxp/imx/.
KERNEL_DEVICETREE = "nxp/imx/glowforge.dtb"

UBOOT_MACHINE ?= "glowforge_defconfig"
UBOOT_MAKE_TARGET = "all"
UBOOT_SUFFIX = "imx"
WKS_FILE = "glowforge.wks"

# The serial getty on ttymxc0 comes from imx-base.inc's SERIAL_CONSOLES.

MACHINE_FIRMWARE += " linux-firmware-wl18xx"

MACHINE_FEATURES += " wifi"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " \
  kernel-module-glowforge \
"
