# This is the most basic ntp configuration file
# The driftfile must remain in a place specific to this
# machine - it records the machine specific clock error
driftfile /var/lib/ntp/drift
# The board has no RTC: every cold boot starts at the image build
# epoch, so the first correction is measured in years and TLS to the
# Glowforge service stays broken until it happens. Never panic-exit on
# a large offset, and burst the first polls so valid time arrives
# seconds after the network does, not minutes.
tinker panic 0
# This should be a server that is close (in IP terms)
# to the machine.  Add other servers as required.
# Unless you un-comment the line below ntpd will sync
# only against the local system clock.
#
server pool.ntp.org iburst
#
# Using local hardware clock as fallback
# Disable this when using ntpd -q -g -x as ntpdate or it will sync to itself
# server 127.127.1.0
# fudge 127.127.1.0 stratum 14
# Defining a default security setting
restrict -4 default notrap nomodify nopeer noquery
restrict -6 default notrap nomodify nopeer noquery

restrict 127.0.0.1    # allow local host
restrict ::1          # allow local host
